name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}${{ matrix.goexperiment && format(', GOEXPERIMENT={0}', matrix.goexperiment) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: windows-latest
          - os: ubuntu-latest
            goexperiment: simd
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # completion_build.go:307 runs `git rev-parse HEAD^`

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Fetch frozen benchmark corpora
        uses: ./.github/actions/fetch-corpora

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -shuffle=on ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -s -l $(git ls-files '*.go' | grep -v '^vendor/'))"
          if [ -n "$out" ]; then
            echo "files not gofmt-clean:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: gofumpt
        run: |
          out="$(go run mvdan.cc/gofumpt@latest -extra -l $(git ls-files '*.go' | grep -v '^vendor/'))"
          if [ -n "$out" ]; then
            echo "files not gofumpt-clean:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go mod tidy
        run: go mod tidy -diff

      - name: vendor in sync
        run: |
          go mod vendor
          git diff --exit-code -- vendor/ go.mod go.sum

  cross-compile:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: "386" }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: riscv64 }
          - { goos: linux, goarch: ppc64le }
          - { goos: linux, goarch: s390x }
          - { goos: linux, goarch: loong64 }
          - { goos: windows, goarch: arm64 }
          - { goos: js, goarch: wasm }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

  fuzz-smoke:
    name: fuzz (${{ matrix.os }}${{ matrix.goexperiment && format(', GOEXPERIMENT={0}', matrix.goexperiment) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: ubuntu-latest
            goexperiment: simd
    env:
      GOEXPERIMENT: ${{ matrix.goexperiment || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: fuzz each target briefly
        run: |
          targets="$(go test -list '^Fuzz' . | grep '^Fuzz' || true)"
          if [ -z "$targets" ]; then
            echo "no fuzz targets compiled for this configuration" >&2
            exit 1
          fi
          for t in $targets; do
            echo "::group::$t"
            go test -run='^$' -fuzz="^${t}\$" -fuzztime=10s .
            echo "::endgroup::"
          done
